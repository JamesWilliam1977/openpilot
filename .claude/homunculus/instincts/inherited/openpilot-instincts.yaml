# Openpilot Workflow Loggerd Encoder Pipeline Update

## Action

Follow the loggerd-encoder-pipeline-update workflow:
1. Edit or add C++ source/header files in openpilot/system/loggerd/encoder/ (e.g., v4l_decoder.cc, v4l_decoder.h, v4l_encoder.cc, v4l_encoder.h).
2. Edit or add related files in openpilot/system/loggerd/ (e.g., clip_encoder.cc, clip_encoder.h, encoderd.cc, video_writer.cc, video_writer.h).
3. Update build scripts (SConscript) as needed.
4. If applicable, update tools/replay/ files for replay support.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: openpilot/system/loggerd/encoder/v4l_decoder.cc, openpilot/system/loggerd/encoder/v4l_decoder.h, openpilot/system/loggerd/encoder/v4l_encoder.cc

